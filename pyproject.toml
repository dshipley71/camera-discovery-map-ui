[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-discovery-map-ui"
version = "0.1.0"
description = "Standalone map and review UI for camera-discovery artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Camera Discovery Contributors"}]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.8"]

[project.scripts]
camera-discovery-map-ui = "camera_discovery_map_ui.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
camera_discovery_map_ui = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
strict_optional = true
mypy_path = "src"
packages = ["camera_discovery_map_ui"]
